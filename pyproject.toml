[project]
name = "scaling-surgical-ai"
version = "0.1.0"
description = "Code for 'A Comparative Study in Surgical AI: Potential and Limitations of Data, Compute, and Scaling'."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "arch",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pydantic",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "tqdm",
]

[project.optional-dependencies]
gpu = [
    "accelerate",
    "datasets",
    "huggingface-hub",
    "opencv-python-headless",
    "peft",
    "torch",
    "torchaudio",
    "torchvision",
    "transformers",
]
yolo = ["ultralytics==8.4.9"]
api = ["anthropic", "openai"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaling_surgical_ai"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "PTH"]
ignore = ["PTH123", "PTH207"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
